appId: com.pdfforge.pdfeditor
productName: PDF Forge
copyright: Copyright 2024-2026 Hillyard Tech — MIT License

directories:
  output: dist
  buildResources: assets

files:
  - "!node_modules/**/*"
  - "src/main/**/*"
  - "dist-renderer/**/*"
  - "package.json"
  - "dist-main/**/*"   # bundled main-process deps (webpack.main.config.js)

extraMetadata:
  main: src/main/main.js

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PDF Forge
  include: assets/installer.nsh   # registers PDF Forge for .pdf (Open with + Default Apps)

asar: true
asarUnpack:
  - "dist-renderer/ocr/**"
  - "dist-renderer/pdfium/**"
compression: maximum
